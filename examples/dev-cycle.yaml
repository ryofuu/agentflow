name: develop-feature
workspace: .agentflow

on:
  loop:
    max: 15
    until: grep -q '^done$' $WORKSPACE/current-ticket-id 2>/dev/null

jobs:
  planner:
    steps:
      - name: plan
        run: |
          claude -p "WORKSPACE=$WORKSPACE

          $(cat $AGENTFLOW_HOME/agents/planner.md)"

  implementer:
    needs: [planner]
    steps:
      - name: implement
        run: |
          TICKET=$(cat $WORKSPACE/current-ticket-id | tr -d '[:space:]')
          if [ "$TICKET" != "done" ]; then
            PROMPT=$(cat $AGENTFLOW_HOME/agents/implementer.md)
            claude \
              -p "WORKSPACE=$WORKSPACE
          対象チケット: $WORKSPACE/tickets/${TICKET}.md

          ${PROMPT}"
          fi

  reviewer:
    needs: [implementer]
    steps:
      - name: review
        run: |
          TICKET=$(cat $WORKSPACE/current-ticket-id | tr -d '[:space:]')
          if [ "$TICKET" != "done" ]; then
            PROMPT=$(cat $AGENTFLOW_HOME/agents/reviewer.md)
            claude -p "WORKSPACE=$WORKSPACE
          対象チケット: $WORKSPACE/tickets/${TICKET}.md

          ${PROMPT}"
          fi
