name: develop-feature
workspace: .agentflow

on:
  loop:
    max: 3
    until: grep -q '^done$' $WORKSPACE/current-ticket-id 2>/dev/null

jobs:
  planner:
    steps:
      - name: plan
        run: |
          claude -p "WORKSPACE=$WORKSPACE

          $(cat examples/prompts/planner.md)"

  implementer:
    needs: [planner]
    steps:
      - name: implement
        run: |
          TICKET=$(cat $WORKSPACE/current-ticket-id | tr -d '[:space:]')
          if [ "$TICKET" != "done" ]; then
            PROMPT=$(cat examples/prompts/implementer.md)
            claude \
              -p "対象チケット: .tickets/${TICKET}.md

              ${PROMPT}"
          fi

  reviewer:
    needs: [implementer]
    steps:
      - name: review
        run: |
          TICKET=$(cat $WORKSPACE/current-ticket-id | tr -d '[:space:]')
          if [ "$TICKET" != "done" ]; then
            PROMPT=$(cat examples/prompts/reviewer.md)
            claude -p "対象チケット: .tickets/${TICKET}.md

            ${PROMPT}"
          fi
